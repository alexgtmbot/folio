name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.platform }} build and test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-15
          - platform: Linux
            os: ubuntu-24.04
          - platform: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libx11-dev libxcb1-dev libxcursor1 libxi6 libxrandr2 xvfb xdotool xclip desktop-file-utils
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: cargo run --release --locked -- --self-test
      - if: runner.os == 'Linux'
        name: Edit and save in an X11 window
        run: |
          printf 'Original text' > "$RUNNER_TEMP/Window check.md"
          xvfb-run -a bash -eu -o pipefail -c '
            target/release/folio "$RUNNER_TEMP/Window check.md" &
            pid=$!
            trap "kill $pid || true" EXIT
            window=$(timeout 30 xdotool search --sync --name "Window check.md" | head -1)
            xdotool windowfocus --sync "$window"
            xdotool mousemove --window "$window" 300 65 click 1
            xdotool key ctrl+a
            xdotool type --delay 50 "Portable"
            xdotool key ctrl+1 ctrl+s
            wait_for_save() {
              for attempt in {1..30}; do
                if [[ $(cat "$RUNNER_TEMP/Window check.md") == "$1" ]]; then return 0; fi
                sleep 0.2
              done
              cat "$RUNNER_TEMP/Window check.md" >&2
              return 1
            }
            wait_for_save "# Portable"
            xdotool key ctrl+a
            xclip -selection clipboard -t image/png -i screenshots/table.png
            xdotool key ctrl+v
            image="$RUNNER_TEMP/Window check.assets/Pasted image.png"
            for attempt in {1..30}; do
              [[ -s "$image" ]] && break
              sleep 0.2
            done
            test -s "$image"
            xdotool key ctrl+s
            wait_for_save "![Pasted image](Window%20check.assets/Pasted%20image.png)"
          '
      - if: runner.os == 'macOS'
        run: ./package.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/folio.exe,LICENSE,assets/fonts/UFL.txt -DestinationPath target/Folio-Windows-x64.zip
      - if: runner.os == 'Linux'
        run: |
          desktop-file-validate assets/local.folio.editor.desktop
          tar -czf target/Folio-Linux-x64.tar.gz -C target/release folio -C "$GITHUB_WORKSPACE" LICENSE assets/fonts/UFL.txt assets/Folio.svg assets/local.folio.editor.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Folio-${{ matrix.platform }}
          path: |
            target/*.dmg
            target/Folio-Windows-x64.zip
            target/Folio-Linux-x64.tar.gz
          if-no-files-found: error

  attest-linux:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Folio-Linux
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: Folio-Linux-x64.tar.gz
