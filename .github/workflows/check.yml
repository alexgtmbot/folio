name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.platform }} build and test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-15
          - platform: Linux
            os: ubuntu-24.04
          - platform: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxcb1-dev
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: cargo run --release --locked -- --self-test
      - if: runner.os == 'macOS'
        run: ./package.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/folio.exe,LICENSE,assets/fonts/UFL.txt -DestinationPath target/Folio-Windows-x64.zip
      - if: runner.os == 'Linux'
        run: tar -czf target/Folio-Linux-x64.tar.gz -C target/release folio -C "$GITHUB_WORKSPACE" LICENSE assets/fonts/UFL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Folio-${{ matrix.platform }}
          path: |
            target/*.dmg
            target/Folio-Windows-x64.zip
            target/Folio-Linux-x64.tar.gz
          if-no-files-found: error
