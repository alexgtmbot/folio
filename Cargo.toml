[package]
name = "folio"
version = "0.3.1"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui_commonmark = "0.20.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = { version = "0.12.2", default-features = false }
rfd = "0.15"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
pulldown-cmark = { version = "0.12.2", default-features = false, features = ["html"] }
serde_json = "1.0.154"
